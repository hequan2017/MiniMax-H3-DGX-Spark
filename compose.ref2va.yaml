services:
  minimax-h3-ref2va:
    image: minimax-h3-dgx-spark:sm121-fp8-ref2va
    container_name: minimax-h3-ref2va
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: "8gb"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: ${H3_VIDEO_SYNC_TIMEOUT:-7200}
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      HF_HOME: /root/.cache/huggingface
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      H3_BIND_HOST: ${H3_BIND_HOST:-127.0.0.1}
      H3_API_PORT: ${H3_API_PORT:-8000}
      H3_ALLOW_REMOTE_API: ${H3_ALLOW_REMOTE_API:-false}
      VLLM_API_KEY: ${H3_API_KEY:-}
      H3_DIFFUSION_ATTENTION_BACKEND: ${H3_DIFFUSION_ATTENTION_BACKEND:-CUDNN_ATTN}
      H3_EXECUTION_MODE: ${H3_EXECUTION_MODE:-compile}
      H3_CACHE_BACKEND: ${H3_CACHE_BACKEND:-none}
      H3_CACHE_CONFIG: ${H3_CACHE_CONFIG:-}
    volumes:
      - /data1/models/MiniMax-H3/Ref2VA:/models/MiniMax-H3/Ref2VA:ro
      - ${HF_CACHE_DIR:-/data1/hf-cache}:/root/.cache/huggingface
      - ./output:/output
